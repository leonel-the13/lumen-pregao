spring:
  application:
    name: lumen-pregao
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
        generate_statistics: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  session:
    redis:
      namespace: lumen:session
      flush-mode: on-save
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      # desligado: o GlobalExceptionHandler gera problem+json com `code` e erros por campo
      enabled: false

server:
  # o Render define PORT; localmente fica 8080
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 8h
      cookie:
        name: LP_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # estado por componente (db, redis…) sem detalhes internos, para diagnóstico
      show-components: always
  health:
    # em produção o email segue pela API do Resend; o SMTP local não existe
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:nao-responder@exemplo.ao}
  # com chave, os emails seguem pela API HTTP do Resend; sem chave, por SMTP
  resend-api-key: ${RESEND_API_KEY:}
  # segredo partilhado com o frontend para confiar no cabeçalho X-Client-IP (IP real atrás do Cloudflare)
  proxy-secret: ${PROXY_SECRET:}
  identity:
    # domínio institucional — a confirmar (spec §4.1); vazio = recusa todos os registos
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:}
    # parte local do email de estudante: número de estudante com 8 dígitos (ex.: 20221987@isptec.co.ao); vazio = sem regra
    email-local-pattern: ${ALLOWED_EMAIL_LOCAL_PATTERN:^[0-9]{8}$}
    verification-ttl: 24h
    remember-me-days: 14
  security:
    mfa-enc-key: ${MFA_ENC_KEY:}
    rate-limit:
      login-max-failures: 5
      # por IP é mais alto porque a rede do campus partilha IPs (a confirmar)
      login-max-failures-per-ip: 20
      login-window: 15m
      submissions-per-minute: 10
      register-per-hour: 10
      invites-per-hour: 30
  learning:
    max-attempts-default: 3
    failed-attempt-penalty: 5
    hint-penalty: 5
  exam:
    network-grace: 2s
    points-per-grade-unit: 6
  ranking:
    streak-days: 7
    streak-bonus: 50
    zone: Africa/Luanda
  authoring:
    # UNPUBLISH: exercícios ligados saem de publicação; WARN: ficam publicados com aviso (a confirmar)
    legal-change-policy: UNPUBLISH
  contest:
    scheduler-interval-ms: 1000
    sse-clock-interval-ms: 5000
